<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>More headlines</title>
<style>
  html,body{margin:0;background:#ffffff}
  .wrap{max-width:640px;margin:0 auto;padding:16px;
        font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        color:#1a1a1a;line-height:1.5;font-size:15px}
  .note{font-size:14px;color:#6b7280;margin:8px 0}
</style></head>
<body><div class="wrap">
<p class="note" id="out"></p>
<noscript><p class="note">This page needs JavaScript.</p></noscript>
</div>
<script>
var P={"code": "uk", "title": "UK | Daily Reads", "runs": ["2026-10-09-8855a91d", "2026-10-11-3352e632", "2026-10-12-88f58381", "2026-10-13-3ce34c5d", "2026-10-14-3beca8f3", "2026-10-15-7dfc1405", "2026-10-15-b29c1955", "2026-10-16-33457730", "2026-10-19-d259af43", "2026-10-20-d2a42c38", "2026-10-21-a0ef53ed", "2026-10-22-3f3b2354", "2026-10-23-6a883785", "2026-10-23-88970517"], "keep": {"uk": 14, "ea": 14}, "keep_default": 14};
function params(){
  var raw=location.search.replace(/^\?/,"")||location.hash.replace(/^#/,""),p={};
  raw.split("&").forEach(function(kv){if(!kv)return;var i=kv.indexOf("=");
    try{p[decodeURIComponent(i<0?kv:kv.slice(0,i))]=i<0?"":decodeURIComponent(kv.slice(i+1));}catch(e){}});
  return p;}
function expired(code,day){
  var k=P.keep[code]||P.keep_default,d=new Date(day+"T00:00:00"),t=new Date();
  t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return isNaN(d)||Math.round((t-d)/864e5)>k;}
function say(s){document.getElementById("out").textContent=s;}
function gone(code){return "This edition has expired: the list is kept for "+(P.keep[code]||P.keep_default)+" days.";}
(function(){
  var p=params(),r=p.r||"";
  if(/^\d{4}-\d{2}-\d{2}-[0-9a-f]{8}$/.test(r)){
    if(P.runs.indexOf(r)>=0){location.replace(P.code+"/"+r+".html"+location.search+location.hash);return;}
    say(expired(P.code,r.slice(0,10))?gone(P.code):"This edition is no longer available.");return;}
  say("Open this page from the link in the latest "+P.title+" email.");
})();
</script></body></html>
