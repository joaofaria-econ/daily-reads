function params(){
  var raw=location.search.replace(/^\?/,"")||location.hash.replace(/^#/,""),p={};
  raw.split("&").forEach(function(kv){if(!kv)return;var i=kv.indexOf("=");
    try{p[decodeURIComponent(i<0?kv:kv.slice(0,i))]=i<0?"":decodeURIComponent(kv.slice(i+1));}catch(e){}});
  return p;}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function render(){
  var out=document.getElementById("out"),top=document.getElementById("top"),jump=document.getElementById("jump"),p=params();
  out.textContent="";top.textContent="";jump.textContent="";
  if(!p.r){out.appendChild(el("p","note","Open this page from the link in the latest "+PAGE.title+" email."));return;}
  if(p.r!==PAGE.run){out.appendChild(el("p","note","This list is updating or has been replaced by a newer edition. If you just received the email, reload in a minute."));return;}
  var hide={};(p.hide||"").split(",").forEach(function(s){s=s.trim();if(s)hide[s]=true;});
  top.textContent=PAGE.subject+" \u00b7 stories not in the email";
  var first=true,n=0,jl=[];
  PAGE.sections.forEach(function(sec){
    var groups=sec.subs.length?sec.subs:[{key:null,label:null}],blocks=[];
    groups.forEach(function(g){
      var its=PAGE.items.filter(function(it){return it.sec===sec.key&&(g.key===null||it.sub===g.key)&&!hide[String(it.id)];});
      if(its.length)blocks.push({label:g.label,its:its});});
    if(!blocks.length)return;
    var h=el("div","sec"+(first?" first":""),sec.label);out.appendChild(h);first=false;
    blocks.forEach(function(b){
      var g=h;if(b.label){g=el("div","sub",b.label);out.appendChild(g);}
      jl.push({node:g,label:b.label||sec.label.replace(/^\|\s*/,""),n:b.its.length});
      b.its.forEach(function(it){n++;
        var d=el("div","item","\u2023 "+it.lead+" (");
        if(/^https?:\/\//i.test(it.url)){var a=el("a",null,it.src);a.href=it.url;a.target="_blank";a.rel="noopener noreferrer";d.appendChild(a);}
        else d.appendChild(document.createTextNode(it.src));
        d.appendChild(document.createTextNode(")"));out.appendChild(d);});});});
  if(!n)out.appendChild(el("p","note","Nothing else today: every story went into the email."));
  if(jl.length>1)jl.forEach(function(g,i){
    if(i){jump.appendChild(document.createTextNode(" "));jump.appendChild(el("span","dot","\u00b7"));jump.appendChild(document.createTextNode(" "));}
    var a=el("a",null,g.label+" ");a.href="#";a.appendChild(el("span","n",String(g.n)));
    a.addEventListener("click",function(ev){ev.preventDefault();g.node.scrollIntoView({behavior:"smooth",block:"start"});});
    jump.appendChild(a);});
}
window.addEventListener("hashchange",render);render();
